<template>
	
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
		<template if:true={showSpinner}>
				<lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
			</template>
	  <div class="slds-modal__container">
	    <header class="slds-modal__header">
	      <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">User's Permission Clone</h2>
	      <p class="slds-m-top_x-small"></p>
	    </header>
	    <div class="slds-modal__content slds-p-around_small" id="modal-content-id-1">
	    	
	    	<div><span class="slds-text-color_error">{error}</span></div>
	    	<div class="slds-grid">
		    	<!-- Permission Set search -->
				<div class="slds-size_1-of-3" style="margin:0 auto;">
			    	<c-user-search multiple="false" lookup-label="Source User to Clone From" onselected={handleCopyFrom}></c-user-search>
				</div>
		    	<div class="slds-size_1-of-3 slds-m-right_small" style="margin:0 auto;">
			    	<c-user-search multiple="true" lookup-label="Target User to Copy To" onselected={handleCopyTo}></c-user-search>
				</div>
			</div>

		    <div style="height: 250px;">
		    </div>

	    </div>
	    <footer class="slds-modal__footer">
	      <lightning-button variant="neutral" label="Cancel" class="slds-m-right_small" onclick={handleCancel}></lightning-button>
	      <lightning-button variant="brand" label="Clone" onclick={handleClone} disabled={cloneDisabled}></lightning-button>
	    </footer>
	  </div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>
</template>
