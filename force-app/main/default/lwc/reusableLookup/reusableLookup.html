<template>
  <div if:true={isLoading} style="position: relative">
    <lightning-spinner variant="brand" size="large"></lightning-spinner>
  </div>

  <template if:true={showCreation}>
    <template if:true={isSignOther}>
      <c-contact-creation first-name={firstName} last-name={lastName} oncreate={handleCreationSuccess}
        oncancelation={handleCreationCancel}>
      </c-contact-creation>
    </template>
    <template if:false={isSignOther}>
      <c-create-new-lookup object-api-name={objectApiName} fields={fields} oncancelation={handleCreationCancel}
        onsuccess={handleCreationSuccess} duplicaterec={duplicaterec} name={searchString} dl-record-id={dlRecordId}
        loader-id={loaderId}>
      </c-create-new-lookup>
    </template>
  </template>
  <div class="slds-combobox_container" if:false={isValueSelected}>
    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
      <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
        <div class="slds-grid slds-gutters">
          <div class="slds-col">
            <lightning-input onchange={handleChange} onfocus={handleFocus} type="search" value={selectedRecordName} autocomplete="off"
              label="" required={required} placeholder={placeholder} onblur={handleInputBlur}>
            </lightning-input>
          </div>
          <div class="slds-col slds-p-top_medium">
            <lightning-button-icon icon-name="utility:add" onclick={handleCreate} variant="border-filled"
              alternative-text="add" title={label}></lightning-button-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <template if:true={isValueSelected}>
    <label class="slds-form-element__label" for="combobox-id-5" id="combobox-label-id-35"></label>
    <template if:true={required}>
      <span style="color: red">*</span>
    </template>
    <div tabindex="0" class="slds-combobox_container slds-has-selection">
      <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
          <span class="slds-icon_container slds-icon-standard-account slds-combobox__input-entity-icon" title="Account">
            <lightning-icon icon-name={selectedIconName} alternative-text={selectedIconName}
              size="x-small"></lightning-icon>
          </span>
          <button type="button" class="slds-input_faux slds-combobox__input slds-combobox__input-value"
            aria-labelledby="combobox-label-id-34 combobox-id-5-selected-value" id="combobox-id-5-selected-value"
            aria-controls="listbox-id-5" aria-expanded="false" aria-haspopup="listbox">
            <span class="slds-truncate" id="combobox-value-id-19">{selectedRecordName}</span>
          </button>
          <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
            title="Remove selected option" onclick={handleCommit}>
            <lightning-icon icon-name="utility:close" alternative-text="Remove selected option"
              size="x-small"></lightning-icon>
          </button>
        </div>
      </div>
    </div>
  </template>
  <template if:true={showRecentRecords}>
    <div id="listbox-id-4" tabindex="0" onblur={handleBlur} onmousedown={handleDivClick}
      class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
      <ul class="slds-listbox slds-listbox_vertical" role="presentation">
        <template for:each={recordsList} for:item="rec">
          <li role="presentation" key={rec.id} class="slds-listbox__item">
            <div onclick={handleSelect} data-id={rec.id} data-mainfield={rec.mainField} data-subfield={rec.subField}
              class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
              role="option">
              <span class="slds-media__figure slds-listbox__option-icon">
                <lightning-icon icon-name={selectedIconName} alternative-text={selectedIconName}
                  size="small"></lightning-icon>
              </span>
              <span class="slds-media__body">
                <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                  <span>
                    <mark>{rec.mainField}</mark>
                  </span>
                </span>
              </span>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </template>
</template>
