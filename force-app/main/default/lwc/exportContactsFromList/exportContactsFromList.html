<template>
    <template lwc:if={isLoading}>
        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </template>
    <template lwc:else>
        <template lwc:if={typeSelection}>
            <lightning-combobox name="type" label="Type of Export" placeholder="Select Export"
                options={options} onchange={handleChange}>
            </lightning-combobox>
            <br><br><br>
            <div>
                <p style="font-size: 18px;">
                    <b>Standard: </b>
                    Each contact on the list will have their own row
                </p>
            </div>
            <br>
            <div>
                <p style="font-size: 18px;">
                    <b>Executive: </b>
                    Will only populate the significant other column if BOTH spouses are on the original list and they will appear within the same row
                </p>
            </div>
        </template>
        <template lwc:if={columnSelection}>
            <lightning-dual-listbox name="columns" label="Select Columns" source-label="Available" selected-label="Selected"
                options={allColumns} onchange={handleColumnSelection} value={selectedColumns}>
            </lightning-dual-listbox>
            <div class="slds-m-top_medium">
                <lightning-button label="Export" onclick={handleFinish}>
                </lightning-button>
            </div>
        </template>
    </template>
</template>
