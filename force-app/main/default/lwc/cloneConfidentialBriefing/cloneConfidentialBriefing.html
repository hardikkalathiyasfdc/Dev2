<template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <template if:true={isDataLoaded}>
        <div class="slds-card slds-box slds-box_x-small custom-card">
            <lightning-card class="custom-card">
                <div class="custom-card-header">
                    Clone Confidential Briefing
                </div>

                <div class="slds-p-around_medium">
                    <lightning-combobox label="Select Type" value={selectedType} options={typeOptions}
                        onchange={handleTypeChange} class="slds-m-bottom_medium">
                    </lightning-combobox>

                    <!-- Conditional Rendering for Record Picker -->
                    <template if:true={isRecordPicker}>
                        <template if:true={isContactSelected}>
                            <c-contact-search onupdate={handleContactUpdate} multiple="true"
                                section-label="Search Contact" show-significant-other="false"></c-contact-search>
                        </template>
                        <template if:false={isContactSelected}>
                            <lightning-record-picker label="Select Record" placeholder="Search Records..."
                                object-api-name={objectApiName} filters={recordFilters}
                                value={defaultRecordId} onchange={handleRecordSelect} class="slds-m-bottom_medium">
                            </lightning-record-picker>
                        </template>
                    </template>

                    <!-- Conditional Rendering for Combobox -->
                    <template if:true={isComboBox}>
                        <lightning-combobox label="Select Records" options={recordOptions}
                            onchange={handleRecordSelect}>
                        </lightning-combobox>
                    </template>

                    <div class="slds-m-around_medium slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                        <lightning-button label="Save Record" onclick={handleClone} disabled={disabledSaveButton}
                            variant="brand">
                        </lightning-button>
                    </div>
                </div>
            </lightning-card>
        </div>
    </template>
</template>
