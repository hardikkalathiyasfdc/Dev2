<template>
    <template lwc:if={isOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-width">
                <header class="slds-modal__header">
                    <h2 id="modal-heading" class="slds-text-heading_medium">Sort Columns</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-text-title_bold slds-m-bottom_small">
                        Sort by
                    </div>
                    <template for:each={rows} for:item="row" for:index="index">
                        <div key={row.id} class="slds-grid slds-gutters_x-small slds-m-bottom_small slds-align_absolute-center sort-row">
                            <div class="slds-size_10-of-12 slds-var-p-left_small">
                                <div class="slds-grid slds-gutters_x-small" style="margin-top: -0.45em;">
                                    <lightning-button-group class="button-group">
                                        <lightning-button-icon icon-name="utility:arrowup" title="Move up" data-index={index}
                                            onclick={moveUp} disabled={row.disableUp}>
                                        </lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:arrowdown" title="Move down" data-index={index}
                                            onclick={moveDown} disabled={row.disableDown}>
                                        </lightning-button-icon>
                                    </lightning-button-group>
                                    <lightning-combobox data-index={index} value={row.field} options={columnOptions} placeholder="Select a column"
                                        onchange={handleColumnChange} class="column-select slds-m-left_medium">
                                    </lightning-combobox>
                                    <lightning-radio-group class="slds-m-left_small radio-group" data-index={index}
                                        type="button" options={directionOptions} value={row.direction} onchange={handleDirectionChange}>
                                    </lightning-radio-group>
                                </div>
                            </div>
                            <div class="slds-size_2-of-12 slds-text-align_right slds-var-p-right_small">
                                <lightning-button-icon icon-name="utility:delete" title="Delete" data-index={index} onclick={removeRow} disabled={row.disableDelete}>
                                </lightning-button-icon>
                            </div>
                        </div>
                    </template>
                    <div class="slds-m-top_small">
                        <lightning-button variant="base" label="+ Add a sort column" onclick={addRow} disabled={disableAdd}></lightning-button>
                        <span class="slds-float_right slds-text-color_weak">{limitLabel}</span>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <div class="slds-float_left">
                        <lightning-button label="Clear" onclick={handleClear}></lightning-button>
                    </div>
                    <div class="slds-float_right">
                        <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-left_small"></lightning-button>
                        <lightning-button variant="brand" label="Apply" onclick={handleApply} class="slds-m-left_small" disabled={disableApply}>
                        </lightning-button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
