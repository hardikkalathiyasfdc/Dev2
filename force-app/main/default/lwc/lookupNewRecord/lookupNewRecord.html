<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">{modalTitle}</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <template lwc:if={showFormLoading}>
                    <div class="slds-align_absolute-center slds-p-around_medium">
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </div>
                </template>
                <template lwc:if={showRecordTypeStep}>
                    <lightning-combobox
                        label="Record Type"
                        value={selectedRecordTypeId}
                        options={recordTypeOptions}
                        onchange={handleRecordTypeChange}>
                    </lightning-combobox>
                    <div class="slds-m-top_medium slds-align_absolute-center">
                        <lightning-button
                            variant="brand"
                            label="Next"
                            onclick={handleNext}
                            class="slds-m-right_small"
                            disabled={isNextDisabled}>
                        </lightning-button>
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>
                </template>
                <template lwc:if={showFormStep}>
                    <lightning-record-edit-form
                        object-api-name={objectApiName}
                        record-type-id={selectedRecordTypeId}
                        onsubmit={handleFormSubmit}
                        onsuccess={handleSuccess}
                        onerror={handleError}>
                        <lightning-messages></lightning-messages>
                        <div class="slds-grid slds-wrap">
                            <template for:each={processedFields} for:item="field">
                                <div key={field.fieldName} class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                                    <template lwc:if={field.isLookup}>
                                        <c-generic-lookup
                                            data-field-name={field.fieldName}
                                            object-api-name={field.objectApiName}
                                            label={field.label}
                                            display-fields={field.displayFields}
                                            search-fields={field.searchFields}
                                            filter-clause={field.filterClause}
                                            icon={field.icon}
                                            allow-new-record={field.allowNewRecord}
                                            new-record-settings={field.newRecordSettings}
                                            onchange={handleLookupChange}>
                                        </c-generic-lookup>
                                    </template>
                                    <template lwc:if={field.isStandard}>
                                        <lightning-input-field
                                            field-name={field.fieldName}>
                                        </lightning-input-field>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <div class="slds-m-top_medium slds-align_absolute-center">
                            <template lwc:if={isSaving}>
                                <lightning-spinner alternative-text="Saving" size="small" class="slds-m-right_small"></lightning-spinner>
                            </template>
                            <lightning-button
                                type="submit"
                                variant="brand"
                                label="Save"
                                disabled={isSaving}
                                class="slds-m-right_small">
                            </lightning-button>
                            <lightning-button
                                label="Cancel"
                                disabled={isSaving}
                                onclick={handleCancel}>
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
