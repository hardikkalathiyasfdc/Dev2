<template>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" 
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">
                    Export List Members
                </h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-spinner lwc:if={isLoading} variant="brand" size="large"></lightning-spinner>
                <template lwc:else>
                    <template lwc:if={typeSelection}>
                        <lightning-combobox name="type" label="Type of Export" placeholder="Select Export"
                            options={options} onchange={handleChange}>
                        </lightning-combobox>
                        <br><br><br>
                        <div>
                            <p style="font-size:18px;"><b>Standard: </b>Each contact on the list will have their own row</p>
                        </div>
                        <br>
                        <div>
                            <p style="font-size:18px;">
                                <b>Executive: </b>
                                Will only populate the significant other column if BOTH spouses are on the original 
                                list and they will appear within the same row
                            </p>
                        </div>
                    </template>
                    <template lwc:if={columnSelection}>
                        <lightning-dual-listbox name="columns" label="Select Columns" source-label="Available"
                            selected-label="Selected" options={allColumns} onchange={handleColumnSelection} value={selectedColumns}>
                        </lightning-dual-listbox>
                    </template>
                </template>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button variant="brand" label="Cancel" title="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button disabled={shallDisableExportButton} variant="brand" class="slds-var-p-left_large" 
                    label="Export" onclick={handleExport}>
                </lightning-button>
            </footer>
        </div>
    </section>
</template>
