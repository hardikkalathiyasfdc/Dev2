<template>
    <div class="slds-form-element">
        <label style="font-size: 0.75rem; color:#444444;">{labelName}</label>
        <div class="slds-form-element__control slds-var-p-top_x-small">
                 <div class="slds-combobox_container">
      <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open" 
       aria-expanded="true" aria-haspopup="listbox" role="combobox">
                    <!-- 
                        BRME-6283
                        This condition is added as the component is being used on Guest Summary Email screen where
                        Source values are needed by default. In other places, default values will be hidden until 
                        user types something
                    -->
                    <template lwc:if={isListMemberSource}>
                    <div onclick={handleFocus} class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-has-focus" role="none">
                        <lightning-input id="input" value={searchInput} onchange={onchangeSearchInput} variant="label-hidden" 
                            aria-autocomplete="list" role="textbox" autocomplete="off" placeholder="Search..." type="search">
      </lightning-input>
                       </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-has-focus" role="none">
                            <lightning-input id="input1" value={searchInput} onchange={onchangeSearchInput} variant="label-hidden" 
                                aria-autocomplete="list" role="textbox" autocomplete="off" placeholder="Search..." type="search">
                            </lightning-input>
                        </div>
                    </template>
                    
                    <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon slds-input-has-icon_left-right slds-var-p-top_x-small" role="none">
                           <template for:each={globalSelectedItems} for:item="selectedItem">
                            <span key={selectedItem.value} class="slds-var-p-right_x-small slds-var-p-bottom_x-small">
                                <lightning-pill label={selectedItem.label} name={selectedItem.value} data-item={selectedItem.value} onremove={handleRemoveRecord}>
                                    <lightning-icon icon-name={iconName} variant="circle" alternative-text={selectedItem.label}>
                                    </lightning-icon>
                                   </lightning-pill>
                               </span>
                           </template>                     
                       </div>
                    <template lwc:if={isDisplayMessage}>
                           <lightning-card>No records found.</lightning-card>
                       </template> 
                    <template lwc:else>
                        <template lwc:if={isDialogDisplay}>
                               <section aria-describedby="dialog-body-id-26" aria-label="Language Options" 
       class="slds-popover slds-popover_full-width" id="popover-unique-id-02" role="dialog">
                                   <div class="slds-popover__body slds-popover__body_small" id="dialog-body-id-26">
                                       <fieldset class="slds-form-element">   
                                        <lightning-checkbox-group name="Checkbox Group" label={objectAPIName} options={items} 
                                            value={value} onchange={handleCheckboxChange}>
                                           </lightning-checkbox-group>
                                       </fieldset>
                                   </div>
                                   <footer class="slds-popover__footer slds-popover__footer_form">
                                    <template lwc:if={showCancel}>
                                        <lightning-button label="Cancel" title="Cancel" 
                                            onclick={handleCancelClick} class="slds-m-left_x-small">
                                        </lightning-button>
                                        </template>
                                    <lightning-button variant="brand" label="Done" title="Done"
                                        onclick={handleDoneClick} class="slds-m-left_x-small">
                                    </lightning-button>                                
                                   </footer>
                               </section>                                               
                           </template>
                       </template>
                  </div>
             </div>
         </div>
     </div>
   </template>
