<template>
  <section
    class="slds-modal slds-fade-in-open slds-modal_small slds-align_absolute-center"
  >
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
          Send Emails
        </h2>
      </header>
      <div
        class="slds-modal__content slds-p-around_medium"
        style="overflow-y: auto; max-height: 80%; min-height: 300px"
      >
        <template if:true={isLoading}>
          <div class="exampleHolder">
            <lightning-spinner
              alternative-text="Loading"
              size="medium"
            ></lightning-spinner></div
        ></template>
        <div class="slds-grid slds-wrap">
          <div class="slds-col slds-size_2-of-2">
            <template if:true={hasSelected}>
              <h1>
                You have selected {recordIds.length} of {total} member(s) to
                send emails to.
              </h1>
              <lightning-combobox
                name="Select Email Type"
                label="Select Email Type"
                value={emailType}
                placeholder="Select Email Type to send"
                class="marginTop"
                options={emailOptions}
                onchange={handleEmailChange}
              ></lightning-combobox>

              <div style="height: 300px; overflow-y: auto; margin-top:2%;">
                <lightning-datatable
                  key-field="Id"
                  data={selectedMembers}
                  columns={columns}
                  column-widths-mode="auto"
                  hide-checkbox-column
                >
                </lightning-datatable>
              </div>
            </template>
            <template if:true={hasNoneSelected}>
              <h1>Please select a member to send invitations to.</h1>
            </template>
            <template if:false={hasSelected}>
              <h1>{successNum} invitation(s) were successfully sent.</h1>
              <br />
              <h1>The following invitation(s) were not sent due to errors:</h1>
              <template for:each={errorsList} for:item="err">
                <h1 key={err.name}>{err.name}</h1>
                <ul key={err.name} class="slds-list_dotted">
                  <template for:each={err.errors} for:item="errMsg">
                    <li key={errMsg}>{errMsg}</li>
                  </template>
                </ul>
              </template>
            </template>
          </div>
        </div>
      </div>

      <footer class="slds-modal__footer">
        <lightning-button
          variant="neutral"
          label="Close"
          title="Close"
          onclick={onClose}
        ></lightning-button>

        <template if:true={hasSelected}>
          <lightning-button
            class="slds-m-top_small myBtn"
            variant="brand"
            type="submit"
            name="Send"
            label="Send"
            onclick={handleSend}
          ></lightning-button
        ></template>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open"></div>
</template>
