<template>
	<template if:true={hasMessages}>
        <div style="padding-bottom: 10px;" class={sectionClass}>
			<template for:each={messages.data} for:item="message">
				<div key={recordId} class="body slds-m-around_x-small">
					<lightning-icon icon-name={iconName} alternative-text="icon" size="small" class={notifyClass}></lightning-icon>
					<div class={messageClass}>{message}</div>
				</div>
			</template>
		</div>
	</template>
	<template if:true={hasErrorMessage}>
        <div style="padding-bottom: 10px;" class={sectionClass}>
			<div class="body slds-m-around_x-small">
				<lightning-icon icon-name={iconName} alternative-text="icon" size="small" class={notifyClass}></lightning-icon>
				<div class={messageClass}>{errorMessage}</div>
			</div>
		</div>
	</template>
</template>
