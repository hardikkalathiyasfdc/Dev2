<template>
	<article class="slds-card">
		<div class="slds-card__header slds-grid">
			<header class="slds-media slds-media_center slds-has-flexi-truncate">
				<div class="slds-media__figure">
					<img src={eventHistoryLogo} width="20" height="20" />
				</div>
				<div class="slds-media__body">
					<h2 class="slds-card__header-title">
						<a class="slds-card__header-link slds-truncate" title="Event History">
							<span><strong>Events</strong></span>
						</a>
					</h2>
				</div>
				<div class="slds-clearfix">
					<template lwc:if={isPrintBtnAccessible}>
						<template lwc:if={isDesktop}>
							<div class="slds-float_right">
								<lightning-button label="Print" onclick={handlePrint} class="slds-m-left_small"></lightning-button>
							</div>
						</template>
					</template>
					<template lwc:if={showButton}>
						<div class="slds-float_right">
							<lightning-button label={buttonLabel} onclick={handleContentDisplay}></lightning-button>
						</div>
					</template>
				</div>
			</header>
		</div>
		<div>
			<div class="slds-card__body slds-scrollable--y">
				<ul>
					<template for:each={events} for:item="cm">
						<li key={cm.id}>
							<div class="slds-m-around_small">
									<div>
										<lightning-formatted-url value={cm.url} label={cm.eventName} target="_blank"></lightning-formatted-url>
										<template lwc:if={cm.isConfidentialBriefings}>
											&nbsp;
											<span>
												<lightning-icon icon-name="standard:attach" alternative-text="Confidential Briefing" size="xx-small">
												</lightning-icon>
											</span>
										</template>
									</div>
								<div>
									<span>Event Date: <span>{cm.startDate}</span></span>
								</div>
								<div>
									<span>{cm.rsvpAttendedStatus}</span>
								</div>
								<template lwc:if={cm.mrbAttended}>
									<div>
										<span>MRB Attendance: Yes</span>
									</div>
								</template>
								<template lwc:if={cm.guestOfName}>
									<div>
										<span>Guest Of: <span>{cm.guestOfName}</span></span>
									</div>
								</template>
							</div>
						</li>
					</template>
				</ul>
			</div>
		</div>
    </article>
</template>
