<template>
	<div class="slds-table_styles">
		<article class="slds-card">
			<div class="slds-card__header slds-grid slds-m-bottom_none">
				<header class="slds-media slds-media_center slds-has-flexi-truncate">
					<div class="slds-media__figure slds-m-left_medium slds-m-top_small slds-m-bottom_small">
						<lightning-icon icon-name="standard:file" size="small"></lightning-icon>
						<span class="slds-assistive-text">files</span>
					</div>
					<div class="slds-media__body">
						<h2 class="slds-card__header-title">
							<a href="#" class="slds-card__header-link slds-truncate" title="Files">
								<span>{header} ({numberOfFiles})</span>
							</a>
						</h2>
					</div>
					<div class="slds-no-flex slds-m-top_x-small slds-m-bottom_x-small slds-m-right_small">
						<template if:false={displayReadMode}>
							<lightning-button-group>
								<template if:true={showAddFiles}>
									<lightning-button
										variant="brand-outline"
										label="Add Files"
										title="Add Files"
										onclick={handleFileUpload}
										class="slds-m-left_x-small">
									</lightning-button>
								</template>
								<template if:true={showAddLinks}>
									<lightning-button variant="brand-outline" label="Add File Link" title="Add File Link" onclick={handleFileLinkUpload}>
									</lightning-button>
								</template>
							</lightning-button-group>
						</template>
						<template if:true={isFileUpload}>
							<section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
								<div class="slds-modal__container">
									<button class="slds-button slds-button_icon slds-modal__close" onclick={handleClose}>
										<lightning-icon icon-name="utility:close" size="small"></lightning-icon>
										<span class="slds-assistive-text">Files</span>
									</button>
									<div class="slds-modal__header">
										<h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Upload Files</h1>
									</div>
									<div class="slds-modal__content slds-p-around_medium">
										<lightning-file-upload
											name="fileUploader"
											record-id={fileGroupId}
											onuploadfinished={handleUploadFinished}
											multiple
											class="slds-p-top_xx-small slds-align_absolute-center slds-border_bottom slds-p-bottom_x-large slds-m-bottom_large">
										</lightning-file-upload>
									</div>
								</div>
							</section>
							<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
						</template>
						<template if:true={isFileLinkUpload}>
							<section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
								<div class="slds-modal__container">
									<button class="slds-button slds-button_icon slds-modal__close" onclick={handleClose}>
										<lightning-icon icon-name="utility:close" size="small"></lightning-icon>
										<span class="slds-assistive-text">Files</span>
									</button>
									<div class="slds-modal__header">
										<h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Add File Link</h1>
									</div>
									<div class="slds-modal__content slds-p-around_medium">
										<lightning-record-edit-form object-api-name="File_Link__c">
											<lightning-input
												label="File Name"
												onchange={handleFileNameChange}
												class="inputName slds-m-bottom_large"
												placeholder="Enter File Name..."
												required>
											</lightning-input>
											<lightning-input
												label="File URL"
												onchange={handleFileLinkChange}
												class="inputURL slds-m-bottom_large"
												placeholder="Enter valid URL..."
												required>
											</lightning-input>
											<lightning-button
												class="slds-float_right slds-m-top_medium"
												type="submit"
												name="submit"
												label="Save"
												variant="brand"
												onclick={handleSubmit}></lightning-button>
											<lightning-button
												class="slds-float_right slds-m-right_small slds-m-top_medium"
												label="Cancel"
												onclick={handleClose}></lightning-button>
										</lightning-record-edit-form>
									</div>
								</div>
							</section>
							<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
						</template>
					</div>
					<template if:true={isFileDelete}>
						<section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
							<div class="slds-modal__container">
								<button class="slds-button slds-button_icon slds-modal__close" onclick={handleClose}>
									<lightning-icon icon-name="utility:close" size="small"></lightning-icon>
									<span class="slds-assistive-text">files</span>
								</button>
								<div class="slds-modal__header">
									<h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Delete File?</h1>
								</div>
								<div class="slds-modal__content slds-p-around_medium">
									<p class="slds-text-align_center">Deleting a file also removes it from any records it's attached to.</p>
								</div>
								<div class="slds-modal__footer">
									<button class="slds-button slds-button_neutral" aria-label="Cancel and close" onclick={handleClose}>Cancel</button>
									<button class="slds-button slds-button_brand" onclick={handleDelete}>Delete</button>
								</div>
							</div>
						</section>
						<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
					</template>
				</header>
			</div>
			<div class="slds-card__body slds-m-top_none slds-border_top">
				<lightning-datatable
					data={records}
					columns={columns}
					key-field="Id"
					hide-checkbox-column="true"
					onrowaction={handleRowAction}
					onrowselection={getSelectedName}
					resize-column-disabled
					sorted-by={sortBy}
					sorted-direction={sortDirection}
					onsort={doSorting}
					default-sort-direction={sortDirection}>
				</lightning-datatable>
			</div>
		</article>
	</div>
</template>
