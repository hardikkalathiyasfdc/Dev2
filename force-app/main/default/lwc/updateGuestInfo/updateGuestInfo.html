<template>
    <!--Modal Header-->
    <lightning-modal-header label='Update Guest Info'>
    </lightning-modal-header>
    <!--Modal Body-->
    <lightning-modal-body>
        <div class="slds-m-bottom_large">
            <lightning-combobox name="column" label="Select Column To Update" placeholder="Select Column"
                value={selectedColumn} onchange={handleColumnChange} options={columnOptions} variant='label-inline'
                required>
            </lightning-combobox>
        </div>
        <lightning-record-edit-form object-api-name={object}>
            <lightning-input-field field-name={selectedColumn} value={value} onchange={handleChange} data-id="input">
            </lightning-input-field>
        </lightning-record-edit-form>
    </lightning-modal-body>
    <!--Modal Footer-->
    <lightning-modal-footer>
        <lightning-button class="slds-button" variant="neutral" label="Cancel" onclick={handleClose}></lightning-button>
        <lightning-button class="slds-button slds-m-left_x-small" variant="brand" label="Save"
            onclick={handleSave}></lightning-button>
    </lightning-modal-footer>
</template>
