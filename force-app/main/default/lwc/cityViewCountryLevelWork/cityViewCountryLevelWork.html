<template>
    <template lwc:if={isLoading}>
        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </template>
    <div lwc:else class="slds-m-top_small box slds-p-around_x-small" style="background-color: white; clear: both;" id={geoAreaId}>
        <h3>State Level Work</h3>
        <div class="slds-m-bottom_xx-small" style="text-align: right; margin-bottom: 1px; margin-top: -10px">
            <lightning-button-menu alternative-text="Sort" icon-name="utility:sort" icon-size="xx-small" label=""
                class="tiny-button-menu" style="margin-right: 7px;" onselect={handleSortChange} menu-alignment="right">
                <lightning-menu-item label="BP Work" checked={sortByAssociation} value="association">
                </lightning-menu-item>
                <lightning-menu-item label="State" checked={sortByCity} value="city">
                </lightning-menu-item>
            </lightning-button-menu>
        </div>
        <div style="max-height: 300px !important; overflow: auto !important;" data-id="StateCityWork">
            <template lwc:if={sortByCity}>

                <table class="slds-table slds-table_fixed-layout">
                    <tbody>
                        <template if:true={showCityWork}>
                            <template for:each={cityWorkData} for:item="city">
                                <tr key={city.cityId} class="table-border slds-hint-parent" style="cursor: pointer;">
                                    <td>
                                        <div
                                            class="slds-grid slds-grid_vertical-align-center slds-var-p-vertical_xx-small">
                                            <a href="javascript:void(0);" onclick={handleCityClick}
                                                data-id={city.cityId}>
                                                <b>{city.displayName}</b>
                                            </a>
                                            <template if:false={isMobile}>
                                                <lightning-icon icon-name="utility:expand_alt"
                                                    alternative-text="More Info" size="xx-small" class="info-icon"
                                                    style="margin-left: 8px; cursor: pointer;"
                                                    onclick={openSelectedCityDetails} data-id={city.cityId}
                                                    title="Click here to view details for this city">
                                                </lightning-icon>
                                            </template>
                                        </div>
                                    </td>
                                </tr>

                                <template if:true={city.showAssociations}>
                                    <template for:each={city.orgAssociations} for:item="org">
                                        <tr key={org.Id} style={org.colorStyle} title={org.focusArea}
                                            class="table-border">
                                            <td class={org.customCss}>
                                                <template if:true={org.showDate}>
                                                    <div class="wrapped-content">
                                                        <template lwc:if={org.nonConsecutive}>
                                                            <a href="javascript:void(0);" data-id={org.orgAssociationId}
                                                                onclick={handleOrgClick}>
                                                                <span>{org.associationName} ({org.startDate} -
                                                                    {org.endDate}) (Non-Consecutive)</span>
                                                            </a>
                                                        </template>
                                                        <template lwc:else>
                                                            <a href="javascript:void(0);" data-id={org.orgAssociationId}
                                                                onclick={handleOrgClick}>
                                                                <span>{org.associationName} ({org.startDate} -
                                                                    {org.endDate})</span>
                                                            </a>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template if:false={org.showDate}>
                                                    <div class="wrapped-content">
                                                        <a href="javascript:void(0);" data-id={org.orgAssociationId}
                                                            onclick={handleOrgClick}>
                                                            <span>{org.associationName}</span>
                                                        </a>
                                                    </div>
                                                </template>
                                            </td>
                                        </tr>
                                        <template if:true={org.showDescription}>
                                            <tr key={org.orgAssociationId} class="table-border" style={org.colorCode}>
                                                <td class="wrapped-content">
                                                    <template if:true={org.description}>
                                                        <lightning-formatted-rich-text value={org.description}>
                                                        </lightning-formatted-rich-text>
                                                    </template>
                                                    <template if:false={org.description}>
                                                        <p>No Initiative description at this time.</p>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                </template>
                            </template>
                        </template>
                        <template if:false={showCityWork}>
                            <tr>
                                <td>No State Level Work</td>
                            </tr>
                        </template>
                    </tbody>
                </table>

            </template>
            <template lwc:else>

                <table class="slds-table slds-table_fixed-layout">
                    <tbody>
                        <template if:true={showCityWork}>
                            <template for:each={associationData} for:item="org">
                                <tr key={org.orgId} style={org.associationData.colorStyle}
                                    title={org.associationData.focusArea} class="table-border">
                                    <td class={org.customCss}>
                                        <div class="wrapped-content">
                                            <a href="javascript:void(0);" data-id={org.orgId}
                                                onclick={handleAssociationClick}>
                                                <span>{org.displayName}</span>

                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <template if:true={org.showCities}>
                                    <tr key={org.orgId} class="table-border" style={org.associationData.colorStyle}>
                                        <td class="wrapped-content">
                                            <template if:true={org.associationData.description}>
                                                <lightning-formatted-rich-text value={org.associationData.description}>
                                                </lightning-formatted-rich-text>
                                            </template>

                                            <template if:false={org.associationData.description}>
                                                <p>No Initiative description at this time.</p>
                                            </template>

                                            <template for:each={org.cities} for:item="city">
                                                <div key={city.cityId}>
                                                    <div class="slds-grid slds-grid_vertical-align-center slds-var-p-vertical_xx-small"
                                                        style="margin-left: 0px;">
                                                        <span style="margin: 3px;">
                                                            <span class={city.customCss}>&nbsp;{city.displayName}
                                                                <template if:true={city.nonConsecutive}>
                                                                    &nbsp; (Non-Consecutive)
                                                                </template>
                                                            </span>
                                                        </span>
                                                        <template if:false={isMobile}>
                                                            <lightning-icon icon-name="utility:expand_alt"
                                                                alternative-text="More Info" size="xx-small"
                                                                class="info-icon"
                                                                style="margin-left: 8px; cursor: pointer;"
                                                                onclick={openSelectedCityDetails} data-id={city.cityId}
                                                                title="Click here to view details for this city">
                                                            </lightning-icon>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </template>
                        </template>
                        <template if:false={showCityWork}>
                            <tr>
                                <td>No State Level Work</td>
                            </tr>
                        </template>
                    </tbody>
                </table>

            </template>
        </div>
    </div>
</template>
