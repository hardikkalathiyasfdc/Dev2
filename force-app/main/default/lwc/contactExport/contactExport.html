<template>
    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>
    <div class="slds-p-around_medium">
        <template lwc:if={fields.length}>
            <lightning-dual-listbox name="fieldSelection" label="Select Columns" source-label="Available"
                selected-label="Selected" options={fields} value={selectedFields} onchange={handleFieldChange}>
            </lightning-dual-listbox>
            <div class="slds-m-top_medium">
                <lightning-button label="Export" onclick={exportToExcel}>
                </lightning-button>
            </div>
        </template>
    </div>
    <lightning-modal-footer>
        <lightning-button label="Cancel" class="slds-p-horizontal_small" variant="brand" onclick={navigateToRecord}>
        </lightning-button>
    </lightning-modal-footer>
</template>
