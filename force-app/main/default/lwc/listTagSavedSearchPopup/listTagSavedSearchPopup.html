<template>
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Save Search</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input 
                        label="Search Name" 
                        value={searchName} 
                        onchange={handleNameChange}>
                    </lightning-input>
                    <template lwc:if={showSaveAsNewCheckbox}>
                        <lightning-input 
                            type="checkbox" 
                            label="Save As New Search" 
                            onchange={handleCheckboxChange} 
                            checked={saveAsNew}>
                        </lightning-input>
                    </template>
                    
                    <template if:true={errorMessage}>
                        <div class="slds-text-color_error">{errorMessage}</div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isLoading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
