<template>
	<lightning-card>
		<div class="slds-m-around_x-large">
			<div class="slds-m-bottom_medium"> <span class="slds-text-heading_medium">Additional Contact Information</span> </div>
			<lightning-record-view-form
		            record-id={contactId}
		            object-api-name="Contact">
		            <template for:each={contactFields} for:item="name">
		            	<div key={name.Id} class="slds-grid">
				            <div  class="slds-col slds-size_1-of-2 slds-border_bottom">
				            	<template if:true={name.first}>
					                <lightning-output-field field-name={name.first.fieldName}></lightning-output-field>
					            </template>
				            </div>
				            <div  class="slds-col slds-size_1-of-2 slds-border_bottom slds-m-left_medium">
				            	<template if:true={name.second}>
					                <lightning-output-field field-name={name.second.fieldName}></lightning-output-field>
					            </template>
				            </div>
				        </div>

			            <template if:true={name.first}>
			            	<template if:true={name.first.breakLine}>
				            	<div key={name.Id} class="slds-m-bottom_xx-large"></div>
				            </template>
			            </template>
		            </template>
		    </lightning-record-view-form>
		</div>
	</lightning-card>
</template>
