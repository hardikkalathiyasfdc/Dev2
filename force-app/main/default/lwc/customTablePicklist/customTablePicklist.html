<template>
  <div
    class="picklist-container slds-grid slds-grid_align-spread slds-truncate"
    onmouseover={setHoverStyles}
    onmouseout={setHoverOutStyles}
    onfocusout={setHoverOutStyles}
    style="margin-left:5%;max-height: 180px"
  >
    <lightning-formatted-text value={value} class="myText"></lightning-formatted-text>

    <button
      tabindex="-1"
      data-navigation="enable"
      data-action-triggers="enter,space"
      data-action-edit="true"
      class="slds-button slds-button_icon slds-cell-edit__button slds-m-left_x-small"
      style="display: none"
      onclick={openModal}
    >
      <svg
        focusable="false"
        data-key="edit"
        aria-hidden="true"
        viewBox="0 0 52 52"
        class="slds-button__icon slds-button__icon_hint slds-button__icon_lock slds-button__icon_small slds-button__icon_edit slds-icon slds-icon-text-default slds-icon_xx-small"
      >
        <g>
          <g>
            <path
              d="M9.5 33.4l8.9 8.9c.4.4 1 .4 1.4 0L42 20c.4-.4.4-1 0-1.4l-8.8-8.8c-.4-.4-1-.4-1.4 0L9.5 32.1c-.4.4-.4 1 0 1.3zM36.1 5.7c-.4.4-.4 1 0 1.4l8.8 8.8c.4.4 1 .4 1.4 0l2.5-2.5c1.6-1.5 1.6-3.9 0-5.5l-4.7-4.7c-1.6-1.6-4.1-1.6-5.7 0l-2.3 2.5zM2.1 48.2c-.2 1 .7 1.9 1.7 1.7l10.9-2.6c.4-.1.7-.3.9-.5l.2-.2c.2-.2.3-.9-.1-1.3l-9-9c-.4-.4-1.1-.3-1.3-.1l-.2.2c-.3.3-.4.6-.5.9L2.1 48.2z"
            ></path>
          </g>
        </g></svg
      ><span class="slds-assistive-text">Edit Last Name</span>
    </button>
    <template if:true={isModalOpen}>
      <section
        role="dialog"
        tabindex="-1"
        aria-labelledby="modal-heading-01"
        aria-modal="true"
        aria-describedby="modal-content-id-1"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container" style="width: 20%">
          <header class="slds-modal__header">
                
            <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Select Value</h2>
</header>
          <div
            class="slds-modal__content slds-p-around_medium"
            id="modal-content-id-1"
            style="text-align: center"
          >
            <ul class="slds-m-around_medium" style="text-align: center">
              <template if:true={hasNone}>
                <li
                  onclick={handleChange}
                  data-item=""
                >
                  <lightning-button
                    variant="base"
                    label="-- None --"
                    title=""
                    data-item=""
                    onclick={handleChange}
                    class="slds-m-left_x-small"
                    ></lightning-button>
                </li>

              </template>
              <template for:each={options} for:item="opt">
                <li
                  key={opt.value}
                  onclick={handleChange}
                  data-item={opt.value}
                >
                  <lightning-button
                    variant="base"
                    label={opt.value}
                    title={opt.value}
                    data-item={opt.value}
                    onclick={handleChange}
                    class="slds-m-left_x-small"
                    >{opt.value}</lightning-button
                  >
                </li>
              </template>
            </ul>
          </div>
           <div class="slds-modal__footer">
                         
                <button
                        class="slds-button slds-button_neutral"
                        aria-label="Cancel"
                        onclick={closeModal}>
                    Cancel</button>
            </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
