<template>
    <lightning-modal-header label="Organization Details"></lightning-modal-header>
    <lightning-modal-body>
        <template lwc:if={orgDetails}>
            <div class="slds-text-heading_small">Are you sure you want to proceed? Organization with below details will be created in Bgive.</div>
            <br/>
            <div class="slds-section-custom slds-section-custom_fixed-height">
                <h3>Bgive Organization</h3>
                <c-blink-organization-card org-details={orgDetails} is-brm-org></c-blink-organization-card>
            </div>
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button variant="brand" label="OK" onclick={handleOk}></lightning-button>&nbsp;&nbsp;
        <lightning-button variant="brand" label="Cancel" onclick={handleCancel}></lightning-button>
    </lightning-modal-footer>
</template>
