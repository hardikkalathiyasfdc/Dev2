<template>
	<section class="slds-modal slds-fade-in-open slds-modal_small slds-align_absolute-center">
		<div class="slds-modal__container">
			<header class="slds-modal__header">
				<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
				<h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Duplicate Contact(s)</h2>
			</header>
			<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
				<lightning-card variant="Narrow" title={title} icon-name="standard:contact">
					<template if:true={contactRecords}>
						<template for:each={contactRecords} for:item="contact">
							<div class="slds-p-around_medium lgc-bg" key={contact.Id}>
								<lightning-tile type="media">
									<a href={contact.href} target="_blank">{contact.Name}</a>
									<lightning-icon slot="media" icon-name="standard:contact"></lightning-icon>
									<template if:true={contact.Touchpoint_sum__c}>
										<p class="slds-truncate" title="Title">Touchpoint Summary:
											{contact.Touchpoint_sum__c}</p>
									</template>
									<template if:true={contact.Organization_Name_formula__c}>
										<p class="slds-truncate" title="OrganizationName">Organization Name:
											{contact.Organization_Name_formula__c}</p>
									</template>
									<template if:true={contact.Title}>
										<p class="slds-truncate" title="Title">Title: {contact.Title}</p>
									</template>
									<template if:true={contact.Email}>
										<p class="slds-truncate" title="Email">Business Email: {contact.Email}</p>
									</template>
									<template if:true={contact.Phone}>
										<p class="slds-truncate" title="Phone">Business Phone: {contact.Phone}</p>
									</template>
									<template if:true={contact.MobilePhone}>
										<p class="slds-truncate" title="MobilePhone">Mobile Phone: {contact.MobilePhone}
										</p>
									</template>
									<template if:true={contact.Significant_Name__c}>
										<p class="slds-truncate" title="Significant_Name">Significant Other Name :
											{contact.Significant_Name__c}</p>
									</template>
								</lightning-tile>
								<lightning-button variant="base" label="Select This Contact" data-name={contact.Id}
									title="Select This Contact" onclick={handleOpenContact} class="slds-m-left_x-small">
								</lightning-button>
							</div>
						</template>
					</template>

					<p slot="footer">
						<lightning-button label="Cancel" title="Close" onclick={closeModal} class="slds-m-left_x-small">
						</lightning-button>
					</p>
				</lightning-card>
			</div>
		</div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>
</template>
