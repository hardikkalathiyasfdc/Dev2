<template>
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small slds-align_absolute-center" style="width:50%;">
		<div class="slds-modal__container">
			<header class="slds-modal__header">
				<h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Generate Event Doc</h2>
			</header>

			<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" >
				<div>
					<lightning-input type="date" name="meetingDate" label="Last Meeting Date" onchange={handleDateChange}></lightning-input>
				</div>

			</div>
			<footer class="slds-modal__footer">
				<button class="slds-button slds-button_neutral" onclick={handleCancel}>Cancel</button>
				<button class="slds-button slds-button_brand" onclick={handleSave}>Generate Doc</button>
			</footer>
		</div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>
</template>
