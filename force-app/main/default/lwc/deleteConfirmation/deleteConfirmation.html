<template>
	<section class="slds-modal slds-fade-in-open slds-modal_small slds-align_absolute-center" style=" width: 50%;">
		<div class="slds-modal__container">
			<header class="slds-modal__header">
				<h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Delete Confirmation</h2>
			</header>
			<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" style="height: 100px;">
				<span>{message}</span>
			</div>
			<footer class="slds-modal__footer">
				<button class="slds-button slds-button_neutral" onclick={handleCancel}>{cancelButtonLabel}</button>
				<button class="slds-button slds-button_brand" onclick={handleSave}>{confirmButtonLabel}</button>
			</footer>
		</div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>

</template>
