<template>
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
	  <div class="slds-modal__container">
	    <header class="slds-modal__header">
	      <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Permission Set Assignment to Team</h2>
	      <p class="slds-m-top_x-small"></p>
	    </header>
	    <template if:true={error}>
	    	<div class="slds-p-around_small" style="background-color: white;"><span class="slds-text-color_error">{error}</span></div>
	    </template>
	    <div class="slds-modal__content slds-p-around_small" id="modal-content-id-1">
	    	<!-- Permission Set search -->
			<div data-id="searchRes" class="slds-form-element slds-lookup slds-is-close">
	        <!--This part is for display search bar for lookup-->  
	        <div class="slds-form-element__control">
	            <div class="slds-input-has-icon slds-input-has-icon--right">
	                <!-- This markup is for when an record is selected -->
	                <div data-id="lookup-pill" class="slds-pill-container">
	                    <div onkeyup={changePermissionSetSearch} onclick={onfocus}>
					        <lightning-input
					            name="enter-search"
					            label=""
					            type="search"
					            variant="label-hidden"
					        ></lightning-input>
					    </div>
	                <!--Selected Records Pills Section-->
	                <template for:each={selectedPermissions} for:item="item">
				        <lightning-pill key={item.Id} class="slds-m-around_xx-small" label={item.Label} id={item.Id} onremove={removeSelection}>
	                        <lightning-icon icon-name="custom:custom45" size="x-small"></lightning-icon>
	                    </lightning-pill>
				    </template>
	                </div>
	            </div>
	        </div>
	 
	        <!--This part is for Display typehead lookup result List-->  
	        <ul style="min-height:40px;margin-top:0px !important" class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid slds-lookup__menu slds" role="listbox">
	            <center> {message}</center>
	            <li role="presentation" class="slds-listbox__item">
	                <span id="listbox-option-unique-id-01" class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
	                    <span class="slds-media__figure">
	                        <span class="slds-icon_container" title="Description of icon when needed">
	                            <lightning-icon icon-name="custom:custom45" size="small"></lightning-icon>
	                        </span>
	                    </span>    
	                    <span class="slds-media__body">  
	                        <span class="slds-listbox__option-text slds-listbox__option-text_entity"><b>Name</b></span>
	                    </span>
	                </span>
	            </li>
	            <template for:each={permissions} for:item="item">
	              <li key={item.Id} role="presentation" class="slds-listbox__item" >
	                <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
	                  <span class="slds-media__figure slds-listbox__option-icon">
	                    <span class="slds-icon_container slds-icon-standard-account">
	                    	<lightning-icon icon-name="custom:custom45" size="small"></lightning-icon>
	                    </span>
	                  </span>
	                  <span class="slds-media__body">
	                    <span class="slds-listbox__option-text slds-listbox__option-text_entity" id={item.Id} onclick={getSelectedRows}>{item.Label}</span>
	                  </span>
	                </div>
	              </li>
	          </template>
	        </ul>
	    </div>

			<lightning-checkbox-group name="Checkbox Group"
                              label="Available Teams"
                              options={teams}
                              value={value}
                              onchange={handleChange}></lightning-checkbox-group>

	    </div>
	    <footer class="slds-modal__footer">
	      <lightning-button variant="neutral" label="Cancel" class="slds-m-right_small" onclick={handleCancel}></lightning-button>
	      <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
	    </footer>
	  </div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>
</template>
