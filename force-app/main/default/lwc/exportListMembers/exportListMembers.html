<template>
	<div class="slds-backdrop slds-backdrop_open"></div>
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
		aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
		<template lwc:if={showLoader}>
			<lightning-spinner alternative-text="Loading" size="medium">
			</lightning-spinner>
		</template>
		<div class="slds-modal__container">
			<header class="slds-modal__header">
				<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">
					Export List Members
				</h2>
			</header>
			<div class="slds-modal__content slds-p-around_medium">
				<div class="slds-grid slds-wrap">
					<div class="slds-col slds-size_2-of-2" style="padding-right: 1%; margin-top:1%;">
						<lightning-dual-listbox name="exports" label="Fields To Export" source-label="Available Fields"
							selected-label="Selected" field-level-help="Select fields to export" options={exportFields}
							value={selectedFields} onchange={handleChange}>
						</lightning-dual-listbox>
					</div>
				</div>
			</div>
			<footer class="slds-modal__footer">
				<lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={closeExport}>
				</lightning-button>
				<lightning-button variant="brand" label="Export" title="Export" disabled={isExportDisabled} onclick={handleExport} class="slds-var-p-left_small">
				</lightning-button>
			</footer>
		</div>
	</section>
</template>
