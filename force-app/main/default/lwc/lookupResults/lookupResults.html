<template>
    <ul class="slds-listbox slds-listbox_vertical" role="listbox">
        <template for:each={processedResults} for:item="record">
            <li key={record.Id} role="presentation" class="slds-listbox__item">
                <c-lookup-result-item
                    record={record}
                    display-fields={displayFields}
                    display-field-prefixes={displayFieldPrefixes}
                    icon={icon}
                    is-selected={record.isSelected}
                    onselect={handleRecordSelect}>
                </c-lookup-result-item>
            </li>
        </template>

        <template lwc:if={allowNewRecord}>
            <li role="separator" class="slds-has-divider_top-space"></li>
            <li role="presentation" class="slds-listbox__item">
                <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_center"
                     role="option"
                     onclick={handleNewRecord}>
                    <span class="slds-media__figure slds-listbox__option-icon">
                        <lightning-icon icon-name="utility:add" size="x-small" alternative-text="New"></lightning-icon>
                    </span>
                    <span class="slds-media__body">
                        <span class="slds-truncate slds-text-link">New {objectLabel}</span>
                    </span>
                </div>
            </li>
        </template>
    </ul>
</template>
