<template>
    <div if:false={isLoading} class="slds-m-top_x-large slds-m-bottom_x-large slds-m-left_x-large slds-m-right_x-large">
        <lightning-card variant="narrow">
            <lightning-layout>
                <div style="background-color:white;"
                    class="slds-m-top_large slds-m-bottom_xx-large slds-m-left_xx-large slds-m-right_xx-large">

                    <h1 class="slds-align_absolute-center slds-m-top_medium">
                        <span class="slds-page-header__title slds-truncate" title={header}>{header}</span>
                    </h1>

                    <lightning-layout-item padding="around-small">
                        <lightning-record-edit-form
                            object-api-name={objectApiName}
                            record-id={fundraisingProjectRecordId}
                            onsuccess={handleSuccess}
                            onsubmit={handleSubmit}
                            onerror={handleError}
                            data-id="fundraisingForm">

                            <lightning-messages></lightning-messages>

                            <div class="slds-box">
                                <lightning-accordion
                                    allow-multiple-sections-open
                                    active-section-name={activeSections}>

                                    <!-- Information -->
                                    <lightning-accordion-section name="A" label="Information">
                                        <div class="slds-grid slds-wrap slds-p-around--medium">
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Name"
                                                    variant="label-stacked"
                                                    required
                                                    onchange={checkduplixtae}>
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Status__c"
                                                    variant="label-stacked"
                                                    required>
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Political__c"
                                                    variant="label-stacked"
                                                    onchange={checkhadnlPoliticaleerror}>
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Personal__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Advocacy__c"
                                                    variant="label-stacked"
                                                    onchange={checkhadnlAdvoeerror}>
                                                </lightning-input-field>
                                            </div>
                                        </div>
                                    </lightning-accordion-section>

                                    <!-- Recipient Organizations -->
                                    <lightning-accordion-section name="B" label="Recipient Organizations">
                                        <template if:true={addorganizations}>
                                            <div style="color:red">Please Add Recipient Organization</div>
                                        </template>
                                        <div>
                                            <template if:true={recepientOrg}>
                                                <c-add-recipient-organization
                                                    add-row-button-name="Add Recipient Organization"
                                                    fileds={recepientOrgColumns}
                                                    card-icon=""
                                                    all-records={recepientOrgData}
                                                    object-name="Recipient_Organization__c"
                                                    card-title=""
                                                    class="recepientClass">
                                                </c-add-recipient-organization>
                                            </template>
                                        </div>
                                    </lightning-accordion-section>

                                    <!-- Project Details -->
                                    <lightning-accordion-section name="C" label="Project Details">
                                        <div class="slds-grid slds-wrap slds-p-around--medium">
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
							<lightning-input-field field-name="Fundraising_Project_Owner__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="BP_Role__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Start_Date__c"
                                                    variant="label-stacked"
                                                    required>
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="End_Date__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Currency__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Goal_Target__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Payments_NOT_Tracked__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Total_Pledge_Amount__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Notes__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                <lightning-input-field
                                                    field-name="Outstanding_Amount__c"
                                                    variant="label-stacked">
                                                </lightning-input-field>
                                            </div>
                                        </div>
                                    </lightning-accordion-section>

                                    <!-- Coding (conditional) -->
                                    <template lwc:if={hasFundraisingCodingAccess}>
                                        <lightning-accordion-section name="E" label="Coding">
                                            <div class="slds-grid slds-wrap slds-p-around--medium">
                                                <div class="slds-col slds-size_7-of-12 slds-p-horizontal_medium">
                                                    <lightning-input-field
                                                        field-name="Foundation_Coding__c"
                                                        variant="label-stacked"
                                                        onchange={handleFoundationCodingChange}>
                                                    </lightning-input-field>
                                                </div>
                                                <div class="slds-col slds-size_7-of-12 slds-p-horizontal_medium">
                                                    <lightning-input-field
                                                        field-name="FC_Focus_Area__c"
                                                        variant="label-stacked">
                                                    </lightning-input-field>
                                                </div>
                                                <div class="slds-col slds-size_7-of-12 slds-p-horizontal_medium">
                                                    <lightning-input-field
                                                        field-name="FC_Initiative__c"
                                                        variant="label-stacked">
                                                    </lightning-input-field>
                                                </div>
                                                <div class="slds-col slds-size_7-of-12 slds-p-horizontal_medium">
                                                    <lightning-input-field
                                                        field-name="FC_Sub_Initiative__c"
                                                        variant="label-stacked">
                                                    </lightning-input-field>
                                                </div>
                                                <div class="slds-col slds-size_7-of-12 slds-p-horizontal_medium">
                                                    <lightning-input-field
                                                        field-name="FC_Sub_Sub_Initiative__c"
                                                        variant="label-stacked">
                                                    </lightning-input-field>
                                                </div>
                                                <div class="slds-col slds-size_7-of-12 slds-p-horizontal_medium">
                                                    <lightning-input-field
                                                        field-name="FC_Sub_Sub_Sub_Initiative__c"
                                                        variant="label-stacked">
                                                    </lightning-input-field>
                                                </div>
                                            </div>
                                        </lightning-accordion-section>
                                    </template>

                                    <!-- System Information -->
                                    <lightning-accordion-section name="F" label="System Information">
                                        <div class="slds-var-p-around_x-large">
                                            <div class="slds-form__row">
                                                <div class="slds-form__item" role="listitem">
                                                    <div class="slds-form-element slds-form-element_edit slds-form-element_readonly slds-form-element_stacked slds-hint-parent">
                                                        <span class="slds-form-element__label">Source System ID</span>
                                                        <div class="slds-form-element__control">
                                                            <lightning-input-field
                                                                field-name="Source_System_ID__c"
                                                                variant="label-hidden">
                                                            </lightning-input-field>
                                                        </div>
                                                    </div>
                                                    <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-accordion-section>

                                </lightning-accordion>
                            </div>
                        </lightning-record-edit-form>
                    </lightning-layout-item>

                    <!-- Activity Form -->
                    <lightning-record-edit-form
                        object-api-name="Fundraising_Activity__c"
                        data-id="activityform"
                        onsuccess={handleActivitySaveSuccess}
                        onerror={handleError}>

                        <template if:false={isActivity}>
                            <lightning-accordion
                                allow-multiple-sections-open
                                active-section-name="E">

                                <lightning-accordion-section name="E" label="Initial Appeal">
                                    <div class="slds-grid slds-wrap slds-p-around--medium">
                                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                            <lightning-input-field
                                                field-name="Name"
                                                variant="label-stacked"
                                                name="Name"
                                                required
                                                onchange={populatevalue}>
                                            </lightning-input-field>
                                        </div>
                                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                            <lightning-input-field
                                                field-name="Date__c"
                                                name="Date__c"
                                                variant="label-stacked"
                                                onchange={populatevalue}>
                                            </lightning-input-field>
                                        </div>
                                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                            <lightning-input-field
                                                field-name="Type__c"
                                                name="Type__c"
                                                variant="label-stacked"
                                                required
                                                onchange={populatevalue}>
                                            </lightning-input-field>
                                        </div>
                                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                            <c-generic-lookup 
                                                data-id="campaign-lookup" 
                                                label="BP Event" 
                                                object-api-name="Campaign" 
                                                icon="standard:campaign"
                                                display-fields={listDisplayFields}
                                                display-field-prefixes={listDisplayFieldPrefixes}
                                                filter-clause={bpEventFilterClause}
                                                search-fields={listSearchFields}
                                                custom-search-class="WeightedFieldLookupSearch"
                                                search-config={campaignSearchConfig}
                                                default-selected-ids={campaignDefaultIds}
                                                onchange={lookupReciRecord}
                                                show-recently-viewed={showRecentlyViewed}
                                                placeholder="Search Lists..."
                                                required={listRequired}>
                                            </c-generic-lookup>
                                        </div>
                                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                                            <lightning-input-field
                                                field-name="Fundraising_Effort_Id__c"
                                                variant="label-stacked"
                                                class="hidden"
                                                data-id="fundraisingid">
                                            </lightning-input-field>
                                        </div>
                                    </div>
                                </lightning-accordion-section>

                            </lightning-accordion>
                        </template>
                    </lightning-record-edit-form>

                    <lightning-layout-item padding="around-small">
                    </lightning-layout-item>

                    <!-- Action Buttons -->
                    <div class="slds-clearfix slds-align_absolute-center slds-m-top_medium">
                        <lightning-button
                            type="submit"
                            variant="brand"
                            label="Save"
                            class="slds-m-around_xx-small"
                            onclick={handleSubmit}>
                        </lightning-button>
                        <lightning-button
                            label="Cancel"
                            class="slds-m-around_xx-small"
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>

                </div>
            </lightning-layout>
        </lightning-card>
    </div>

    <div if:true={isLoading} style="position:relative">
        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </div>
</template>
