<template>
   <template if:true={isLoading}>
        <lightning-spinner variant="brand" size="large"> </lightning-spinner>
    </template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Export</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" style="height: 350px;" id="modal-content-id-1">
                <c-custom-toast></c-custom-toast>
                <template if:false={isLoading}>
                    <template if:true={typeSelection}>
                        <lightning-combobox
                            name="type"
                            label="Type of Export"
                            placeholder="Select Export"
                            options={options}
                            onchange={handleChange} >
                        </lightning-combobox>

                        <br>
                        <br>
                        <br>

                        <div>
                            <p style="font-size:16px;color:black"><b>Standard: </b>Each contact on the list will have their own row</p>
                        </div>
                        <br>
                        <div>
                            <p style="font-size:16px;color:black"><b>Executive: </b>Will only populate the significant other column if BOTH spouses are on the original list and they will appear within the same row</p>
                        </div>
                    </template>
    
                    <template if:true={columnSelection}>
                        <lightning-dual-listbox name="columns"
                                        label="Select Columns"
                                        source-label="Available"
                                        selected-label="Selected"
                                        options={allColumns}
                                        onchange={handleColumnSelection}
                                        value={selectedColumns}>
                        </lightning-dual-listbox>
                    </template>
                </template>
                </div>
            <div class="slds-modal__footer">
                <div class="slds-float_right">
                    <lightning-button label="Export" variant="brand" class="Bbutton" onclick={handleFinish}>
                    </lightning-button>
                    &nbsp;&nbsp;
                    <lightning-button label="Cancel" variant="brand-outline" class="BObutton" onclick={handleCancel}>
                    </lightning-button>
                </div>
                <div class="slds-m-top_medium">
                    
                </div>
            </div>
        </div>
    </section>
</template>
