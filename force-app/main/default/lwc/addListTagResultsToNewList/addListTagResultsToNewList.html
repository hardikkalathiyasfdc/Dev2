<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" 
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Add to Campaign</h2>
            </header>
            <div class="formatModel slds-modal__content" id="modal-content-id-1">
                <lightning-spinner lwc:if={isLoading} alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
                <lightning-record-edit-form object-api-name={campaignObject} onsuccess={handleCampaignCreated}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-var-p-around_xx-large">
                        <div class="slds-col slds-size_2-of-3">
                            <lightning-input-field field-name={nameField}></lightning-input-field>
                            <lightning-input-field field-name={descriptionField}></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-3"></div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="brand" onclick={handleCloseModal} title="Cancel" label="Cancel"></lightning-button>
                        <lightning-button class="slds-var-p-left_large" type="submit" variant="brand" title="Submit" 
                            label="Submit" disabled={isDisabled}>
                        </lightning-button>
                    </footer>
                </lightning-record-edit-form>
            </div>            
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
