<template>
    <template if:true={isLoading}>
        <lightning-spinner variant="brand" size="large"> </lightning-spinner>
    </template>
    <template if:false={isLoading}>
            <lightning-radio-group name="radioGroup"
                              label="List Selection"
                              options={listSelectionOptions}
                              value={value}
                              onchange={radioChange}
                              type="button">
            </lightning-radio-group>
            
            <template if:true={showListLookup}>
                <div class="slds-m-top_medium">
                    <c-generic-lookup
                        object-api-name="Campaign"
                        icon="standard:campaign"
                        label="Select an Existing List"
                        display-fields={listDisplayFields}
                        display-field-prefixes={listDisplayFieldPrefixes}
                        custom-search-class="WeightedFieldLookupSearch"
                        search-config={listSearchConfig}
                        filter-clause={filterClause}
                        required
                        onchange={handleValueSelected}>
                    </c-generic-lookup>
                </div>
            </template>
    
            <template if:true={showListText}>
                <div class="slds-m-top_medium">
                    <lightning-input type="text" required label="Name of List" onchange={handleNewListNameChange}></lightning-input>
                </div>
            </template>
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button label="Add" disabled={isLoading} onclick={handleFinish}>
                </lightning-button>
            </div>
    </template>
</template>
